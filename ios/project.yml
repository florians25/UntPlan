# XcodeGen-Beschreibung von UntPlanMobile (Alternative zum mitgelieferten Xcode-Projekt).
# Erzeugen: im Ordner ios/ "xcodegen generate" ausführen.
name: UntPlanMobile
options:
  bundleIdPrefix: de.untplan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  UntPlanMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Der ganze Ordner, also auch Ansichten/PlanAuswahlView.swift, Ansichten/TabLeiste.swift, Dienste/Favoriten.swift
      # und Dienste/Planmitteilungen.swift (Info.plist wird nicht als Ressource kopiert, sondern über INFOPLIST_FILE eingebunden)
      - path: UntPlanMobile
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.untplan.mobile
        PRODUCT_NAME: UntPlanMobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Ergänzt die generierte Info.plist: Hintergrund-Aktualisierung (UIBackgroundModes fetch) und
        # BGTaskSchedulerPermittedIdentifiers für die Mitteilungen bei Planänderungen
        INFOPLIST_FILE: UntPlanMobile/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: UntPlan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
