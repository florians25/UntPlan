name: Build

# Nur main baut Setup und Release (Arbeitszweige claude/** nicht – sonst doppelte Läufe und doppelter Speicher).
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # Actions-Speicher (0,5 GB im Plan) freihalten: alte Artefakte früherer Läufe löschen – Setup und portable Version
  # liegen ohnehin im Release.
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artefakte = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let geloescht = 0;
            for (const a of artefakte) {
              if (a.workflow_run && a.workflow_run.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
              geloescht++;
            }
            core.info(`${geloescht} alte Artefakte gelöscht`);

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/UntPlan.Core.Tests -c Release

      - name: Windows-Anwendung veröffentlichen (eine EXE, ohne .NET-Installation lauffähig)
        run: >
          dotnet publish src/UntPlan.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=1.0.${{ github.run_number }} -o artifacts/UntPlan

      - name: Portal-Referenzserver veröffentlichen
        run: dotnet publish src/UntPlan.Portal -c Release -o artifacts/UntPlan.Portal

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DQuelle="$PWD\artifacts\UntPlan" /DAppVersion="1.0.${{ github.run_number }}" /O"$PWD\artifacts" installer\UntPlan.iss

      - name: Portable Version packen
        shell: pwsh
        run: Compress-Archive -Path artifacts/UntPlan/* -DestinationPath artifacts/UntPlan-portabel.zip

      - name: Selbsttest der Oberfläche (alle Fenster öffnen, Bildschirmfotos)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/UntPlan/UntPlan.exe -ArgumentList "--selbsttest=$PWD/artifacts/selbsttest" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Selbsttest hat nicht beendet" }
          Get-Content artifacts/selbsttest/selbsttest.log
          if (Select-String -Path artifacts/selbsttest/selbsttest.log -Pattern "^FEHLER") { throw "Selbsttest fehlgeschlagen" }

      - name: Release mit Setup-EXE veröffentlichen
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UntPlan 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: docs/RELEASENOTES.md
          files: |
            artifacts/UntPlan-Setup-*.exe
            artifacts/UntPlan-portabel.zip

      # Bildschirmfotos nur bei Fehlern und nur kurz aufbewahren (Speicher)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Selbsttest-Bildschirmfotos
          path: artifacts/selbsttest
          retention-days: 3
