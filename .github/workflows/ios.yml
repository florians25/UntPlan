name: iOS (Simulator)

# Baut die iOS-App (ios/UntPlanMobile) auf macOS, startet sie im iOS-Simulator gegen den UntPlanWeb-Demo-Server und
# macht Bildschirmfotos der wichtigsten Ansichten. Die App wird dabei über Startargumente gesteuert (nur Debug-Builds,
# siehe Startsteuerung in Dienste/AppZustand.swift): Anmeldung, Plan, Tag und Ansicht.
# Die Fotos liegen als Artefakt vor und stehen zusätzlich in voller Auflösung (PNG) als Base64 im Protokoll
# (Zeilen „BILD-ANFANG name“, „B64 …“ je 4000 Zeichen, „BILD-ENDE name“).
on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'ios/**'
      - 'web/src/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Neueste Xcode-Version wählen
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Beispielwoche ergänzen (nur in diesem Lauf)
        run: |
          cat > $RUNNER_TEMP/demo.py <<'PY'
          # Beispielwoche der Klasse 6a wie die Vorlagen: Entfall (rot), Raumänderung (grüne Raum-Plakette), Vertretung mit Text
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          tage = {t["datum"]: t for t in d["tage"]}
          erste = sorted(tage)[0]
          import datetime as dt
          mo = dt.date.fromisoformat(erste)
          mo -= dt.timedelta(days=mo.weekday())
          iso = lambda n: (mo + dt.timedelta(days=n)).isoformat()
          nid = max(v["id"] for v in d["vertretungen"]) + 1
          def stunde(tag, nr, fach):
              return next(s for s in tage[iso(tag)]["stunden"] if s["stunde"] == nr and "6a" in s["klassen"] and s["fach"] == fach)
          def vertretung(**k):
              global nid
              v = {"id": nid, "klassen": ["6a"], "vertreter": "", "fach": "", "neuesFach": "", "raum": "", "neuerRaum": "",
                   "vertrVon": "", "nach": "", "text": "", "nurLehrer": False}
              v.update(k); d["vertretungen"].append(v); nid += 1
              return v["id"]
          # Donnerstag 1. Stunde (F, SWA) entfällt
          s = stunde(3, 1, "F")
          s["status"] = "entfall"
          s["vertretung"] = vertretung(datum=iso(3), stunde=1, art="Entfall", lehrer="SWA", vertreter="---", fach="F", neuesFach="F", raum="R103")
          # Freitag 6. Stunde (F, SWA): Raumänderung R103 → R105
          s = stunde(4, 6, "F")
          s["status"] = "vertreten"; s["raeume"] = ["R105"]
          s["vertretung"] = vertretung(datum=iso(4), stunde=6, art="Raum-Vtr.", lehrer="SWA", vertreter="SWA", fach="F", neuesFach="F", raum="R103", neuerRaum="R105")
          # Donnerstag 5. Stunde (GE, MUE): Vertretung durch WAG mit Vertretungstext (Info-Zeichen)
          s = stunde(3, 5, "GE")
          s["status"] = "vertreten"; s["lehrer"] = ["WAG"]; s["text"] = "Aufgaben im Buch S. 42"
          s["vertretung"] = vertretung(datum=iso(3), stunde=5, art="Vertretung", lehrer="MUE", vertreter="WAG", fach="GE", neuesFach="GE", raum="R103", neuerRaum="R103", text="Aufgaben im Buch S. 42")
          json.dump(d, open(p, "w"), ensure_ascii=False)
          print("Demo-Woche 6a ergänzt")
          # Pausenaufsichten der Lehrkraft BEC: Do. nach der 2. Stunde abgegeben (RIC vertritt), Mo. nach der 4. Stunde vertritt BEC (Halle, WEB)
          vertretung(datum=iso(3), stunde=2, art="Pausenaufsicht", klassen=[], lehrer="BEC", vertreter="RIC", raum="Hof", neuerRaum="Hof", nurLehrer=True)
          vertretung(datum=iso(0), stunde=4, art="Pausenaufsicht", klassen=[], lehrer="WEB", vertreter="BEC", raum="Halle", neuerRaum="Halle", nurLehrer=True)
          # Künftige reguläre Aufsicht der Lehrkraft BEC (Fr. nach der 2. Stunde, Schulhof) wie in der Vorlage 2bb77419
          d["pausenaufsichten"].append({"gang": "Hof", "tag": 4, "nachStunde": 2, "lehrer": "BEC", "wochen": ""})
          # Fachfarben leeren: die Schulen der Vorlagen haben keine (alle Balken grau #bec8cf) – fairer Vergleich
          for f in d["elemente"]["faecher"]:
              f["farbe"] = ""
          json.dump(d, open(p, "w"), ensure_ascii=False)
          print("Aufsichten ergänzt, Fachfarben geleert")
          PY
          python3 $RUNNER_TEMP/demo.py web/demo/beispiel-paket.json

      - name: Demo-Server starten
        run: |
          cd web/src/UntPlanWeb
          UNTPLANWEB_DATEN=$RUNNER_TEMP/daten UNTPLANWEB_DEMO=1 UNTPLANWEB_ADMIN_PASSWORT='Test1234!' \
            ASPNETCORE_URLS=http://127.0.0.1:5077 nohup dotnet run --no-launch-profile > $RUNNER_TEMP/web.log 2>&1 &

      - name: Xcode-Projekt prüfen (alle Swift-Dateien eingetragen?)
        working-directory: ios
        run: |
          fehlt=0
          for f in $(find UntPlanMobile -name '*.swift'); do
            if ! grep -q "$(basename "$f")" UntPlanMobile.xcodeproj/project.pbxproj; then echo "Fehlt im Projekt: $f"; fehlt=1; fi
          done
          if [ $fehlt = 1 ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Simulator wählen
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          def ver(r):
              m = re.search(r"iOS-(\d+)-(\d+)", r)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          laufzeiten = sorted([r for r in d if "iOS" in r and d[r]], key=ver, reverse=True)
          geraete = d[laufzeiten[0]]
          for name in ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]:
              for g in geraete:
                  if g["name"] == name:
                      print(g["udid"]); sys.exit()
          iphones = [g for g in geraete if g["name"].startswith("iPhone")]
          print((iphones or geraete)[0]["udid"])
          ')
          echo "Gewählt: $UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      - name: App bauen (Debug, Simulator)
        run: |
          set -o pipefail
          xcodebuild -project ios/UntPlanMobile.xcodeproj -scheme UntPlanMobile -configuration Debug \
            -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee $RUNNER_TEMP/build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" $RUNNER_TEMP/build.log

      - name: Compilerfehler
        if: failure()
        run: |
          grep -E "error:" -A3 $RUNNER_TEMP/build.log | head -200 || true
          tail -80 $RUNNER_TEMP/build.log || true

      - name: Auf den Demo-Server warten und Konten anlegen
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:5077/api/app/sitzung > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5077/api/app/sitzung || { cat $RUNNER_TEMP/web.log; exit 1; }
          echo
          S=http://127.0.0.1:5077/api/app
          J=$RUNNER_TEMP/admin.cookies
          curl -s -c $J -b $J -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' -d '{"login":"admin","passwort":"Test1234!"}' $S/anmelden; echo
          curl -s -c $J -b $J -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' \
            -d '{"login":"bec","passwort":"Lehrer1234!x","rolle":"lehrer","element":"BEC","anzeigename":"BEC","gesperrt":false}' $S/admin/benutzer; echo
          KIND=$(python3 -c 'import json; d=json.load(open("web/demo/beispiel-paket.json")); print(next(s["id"] for s in d["elemente"]["schueler"] if s["klasse"]=="6a"))')
          echo "Kind: $KIND"
          curl -s -c $J -b $J -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' \
            -d "{\"login\":\"eltern1\",\"passwort\":\"Eltern1234!x\",\"rolle\":\"eltern\",\"anzeigename\":\"Familie Muster\",\"gesperrt\":false,\"schuelerIds\":[$KIND]}" $S/admin/benutzer; echo
          # Abwesenheiten des Kindes in der aktuellen Woche (Montag entschuldigt, Dienstag offen, Mittwoch Verspätung)
          MO=$(python3 -c 'import datetime as d; t=d.date.today(); print(t-d.timedelta(days=t.weekday()))')
          DI=$(python3 -c 'import datetime as d; t=d.date.today(); print(t-d.timedelta(days=t.weekday())+d.timedelta(days=1))')
          MI=$(python3 -c 'import datetime as d; t=d.date.today(); print(t-d.timedelta(days=t.weekday())+d.timedelta(days=2))')
          DO=$(python3 -c 'import datetime as d; t=d.date.today(); print(t-d.timedelta(days=t.weekday())+d.timedelta(days=3))')
          echo "MI=$MI" >> $GITHUB_ENV
          echo "MO=$MO" >> $GITHUB_ENV
          echo "DI=$DI" >> $GITHUB_ENV
          echo "DO=$DO" >> $GITHUB_ENV
          for z in "$MO|07:00|21:00|entschuldigt|K|Grippe" "$DI|07:00|21:00|offen|K|Attest folgt" "$MI|07:55|08:10|offen||Bus verpasst"; do
            IFS='|' read -r tag von bis status grund text <<< "$z"
            curl -s -c $J -b $J -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' \
              -d "{\"schuelerIds\":[$KIND],\"von\":\"${tag}T${von}\",\"bis\":\"${tag}T${bis}\",\"grund\":\"$grund\",\"status\":\"$status\",\"text\":\"$text\"}" \
              $S/klassenbuch/abwesenheit; echo
          done
          # Wie in den Vorlagen: Online-Stunde (Do. 2./3. Stunde 6a, BEC) und Notiz für Schüler*innen (Info-Zeichen, Di. 2. Stunde)
          B=$RUNNER_TEMP/bec.cookies
          curl -s -c $B -b $B -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' -d '{"login":"bec","passwort":"Lehrer1234!x"}' $S/anmelden > /dev/null
          curl -s -b $B -X PUT -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' \
            -d "{\"datum\":\"$DO\",\"stunde\":2,\"unterricht\":127,\"online\":true}" $S/klassenbuch/online; echo
          curl -s -b $B -X PUT -H 'X-UntPlanWeb: 1' -H 'Content-Type: application/json' \
            -d "{\"datum\":\"$DI\",\"stunde\":2,\"unterricht\":127,\"notizSchueler\":\"Bitte Lektüre mitbringen\"}" $S/klassenbuch/stunde > /dev/null; echo

      - name: Simulator starten (Dunkelmodus, Statusleiste 9:41)
        run: |
          U=${{ steps.sim.outputs.udid }}
          xcrun simctl boot $U || true
          xcrun simctl bootstatus $U -b
          xcrun simctl ui $U appearance dark
          xcrun simctl status_bar $U override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Bildschirmfotos
        run: |
          U=${{ steps.sim.outputs.udid }}
          APP=$(find build/Build/Products -maxdepth 2 -name 'UntPlanMobile.app' -path '*iphonesimulator*' | head -1)
          echo "App: $APP"
          # Klartext-HTTP zum lokalen Demo-Server erlauben (nur dieser Testlauf, nicht im Projekt)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$APP/Info.plist" || true
          mkdir -p fotos
          foto() {
            name=$1; shift
            xcrun simctl terminate $U de.untplan.mobile 2>/dev/null || true
            xcrun simctl uninstall $U de.untplan.mobile 2>/dev/null || true
            xcrun simctl install $U "$APP"
            xcrun simctl launch $U de.untplan.mobile -AppleLanguages '(de)' -AppleLocale de_DE \
              -uiServer http://127.0.0.1:5077 "$@"
            sleep 16
            xcrun simctl io $U screenshot "fotos/$name.png"
            echo "Foto: $name"
          }
          L="-uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $MI"
          # Zoom 1,0626 wie die Vorlagen 567a139b/6a2e7724 (sonst 1 wie 6d696e75/00e27251)
          foto 01_Woche_Lehrkraft $L -uiAnsicht woche -uiZoom 1.0626
          foto 02_Woche_Klasse $L -uiAnsicht woche -uiPlan klasse:6a -uiZoom 1.0626
          foto 03_Tag_Lehrkraft $L -uiAnsicht tag -uiZoom 1
          # Vertretung von BEC am Montag (Kunst 5a)
          foto 04_Stundendetails_Vertretung -uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $MO -uiAnsicht details
          foto 05_Meine_Termine $L -uiAnsicht termine
          foto 06_Start_Lehrkraft $L -uiAnsicht start
          foto 07_Meine_Abwesenheiten_Eltern -uiLogin eltern1 -uiPasswort 'Eltern1234!x' -uiDatum $MI -uiAnsicht abwesenheiten
          # Klassenplan: Kopplung (Di.) als Tag, Vertretung mit Text (Do. 5.), Online-Stunde (Do. 2.)
          foto 08_Tag_Klasse $L -uiAnsicht tag -uiPlan klasse:6a -uiDatum $DI -uiZoom 1
          foto 09_Stundendetails_Klasse -uiLogin bec -uiPasswort Lehrer1234!x -uiPlan klasse:6a -uiDatum $DO -uiStunde 5 -uiAnsicht details
          foto 10_Stundendetails_Online -uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $DO -uiStunde 2 -uiAnsicht details
          # Pausenaufsichten: Tag mit abgegebener Aufsicht (Do.) und Details einer Aufsicht
          foto 11_Tag_Lehrkraft_Aufsicht -uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $DO -uiAnsicht tag -uiZoom 1
          foto 12_Aufsicht_Details -uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $DO -uiAnsicht aufsicht
          foto 13_Woche_Lehrkraft_Vorwoche -uiLogin bec -uiPasswort Lehrer1234!x -uiDatum $MO -uiAnsicht woche -uiZoom 1
          ls -la fotos

      # Volle Auflösung (1206 × 2622, PNG wie aufgenommen) – für den Abgleich mit den Vorlagen im Maßstab 3 px/pt
      - name: Bilder ins Protokoll (1)
        if: always()
        run: |
          for f in $(ls fotos/*.png | head -7); do
            n=$(basename "$f")
            echo "BILD-ANFANG $n"
            base64 -i "$f" | tr -d '\n' | fold -w 4000 | sed 's/^/B64 /'
            echo
            echo "BILD-ENDE $n"
          done

      - name: Bilder ins Protokoll (2)
        if: always()
        run: |
          for f in $(ls fotos/*.png | tail -n +8); do
            n=$(basename "$f")
            echo "BILD-ANFANG $n"
            base64 -i "$f" | tr -d '\n' | fold -w 4000 | sed 's/^/B64 /'
            echo
            echo "BILD-ENDE $n"
          done

      - name: Server-Protokoll
        if: always()
        run: tail -60 $RUNNER_TEMP/web.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfotos-iOS
          path: fotos
          retention-days: 3
